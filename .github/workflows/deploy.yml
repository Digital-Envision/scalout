name: CI/CD Scalout

on:
  push:
    branches:
      - main

jobs:
  # CI job to test code in GitHub Actions runner before deploying
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Linter / Tests
        run: |
          # Uncomment if you want tests to pass before deploying
          # bun run lint
          # bun test

  # Deployment job that executes on server
  deploy:
    needs: build-and-test # Waits for tests to pass before executing
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          APP_PORT: ${{ secrets.APP_PORT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Deploying app on the server..."

            APP_DIR="${{ secrets.APP_DIR }}"
            cd $APP_DIR

            # Ensure Bun binaries are available in SSH non-interactive session
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            # Pull latest changes from Git repository
            git pull origin main

            echo "Copy env variables to .env"
            cat << EOF > .env
            NODE_ENV=$NODE_ENV
            APP_PORT=$APP_PORT
            RESEND_API_KEY=$RESEND_API_KEY
            CONTACT_TO_EMAIL=$CONTACT_TO_EMAIL
            CONTACT_FROM_EMAIL=$CONTACT_FROM_EMAIL
            NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
            EOF

            # Install dependencies and build project
            bun install --frozen-lockfile
            bun run build

            bun ~/.bun/bin/pm2 restart ecosystem.config.cjs --env production || bun ~/.bun/bin/pm2 start ecosystem.config.cjs --env production
            bun ~/.bun/bin/pm2 pm2 save
