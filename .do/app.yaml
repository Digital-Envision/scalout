# DigitalOcean App Platform spec for the Scalout profile site (production).
# Deploy with: doctl apps create --spec .do/app.yaml
# or update:   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Replace `repo` / `branch` with your GitHub repo once it is pushed.
name: scalout-web
region: sgp
services:
  - name: web
    environment_slug: node-js
    github:
      repo: your-org/scalout
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: node server.js
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      # Left at App Platform's default RUN_AND_BUILD_TIME scope on purpose: a
      # NEXT_PUBLIC_ variable is inlined during `next build`, so a RUN_TIME
      # scope silently does nothing and the build fails. Set it to the real
      # origin — the build refuses to produce a sitemap without it.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://scalout.com
      # Analytics IDs, same RUN_AND_BUILD_TIME reasoning as above. Declared
      # empty rather than omitted: `src/lib/analytics.ts` reads an empty value
      # as "not configured" and renders no tag, so the site is correct as
      # shipped, and the key is here to be filled in rather than remembered.
      # GA4 measurement ID (G-XXXXXXXXXX), Admin > Data streams.
      - key: NEXT_PUBLIC_GA_ID
        value: ""
      # Microsoft Clarity project ID, Clarity dashboard > Settings > Overview.
      - key: NEXT_PUBLIC_CLARITY_PROJECT_ID
        value: ""
    health_check:
      http_path: /
